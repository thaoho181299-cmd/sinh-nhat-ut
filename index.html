<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Món quà sinh nhật dành cho Út 💗</title>
<style>
:root{--pink:#ff6f9f;--rose:#ffb3c9;--cream:#fff8f1;--purple:#8d6ac8;--ink:#613c61}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:'Trebuchet MS',system-ui,sans-serif;color:var(--ink);background:linear-gradient(145deg,#fff5f7,#fff8ec 55%,#f4eaff);min-height:100vh;overflow-x:hidden}button{font:inherit;cursor:pointer;border:0}.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 18px;position:relative}.intro{text-align:center;max-width:720px;z-index:2}.eyebrow{letter-spacing:4px;text-transform:uppercase;font-size:.78rem;color:#bd6791}.intro h1{font-family:Georgia,serif;font-size:clamp(2.2rem,7vw,4.8rem);line-height:1.12;margin:18px 0;color:#a64f7b}.intro p{font-size:1.08rem;line-height:1.8;max-width:530px;margin:0 auto 26px}.gift{font-size:clamp(4rem,14vw,7rem);animation:bob 2s ease-in-out infinite;filter:drop-shadow(0 10px 12px #d98ca355)}.main-btn{background:linear-gradient(135deg,#ff699b,#bd7ad7);color:white;border-radius:999px;padding:15px 28px;box-shadow:0 10px 25px #db7eae55;font-weight:800;transition:.2s}.main-btn:hover{transform:translateY(-3px);box-shadow:0 14px 30px #db7eae77}.tiny{font-size:.85rem;color:#9e7796;margin-top:15px}.hidden{display:none!important}.celebration{display:block;padding-top:45px}.wrap{max-width:1050px;margin:auto;text-align:center;position:relative;z-index:1}.section-tag{font-size:.78rem;letter-spacing:3px;color:#c16b94;text-transform:uppercase}.wrap h2{font-family:Georgia,serif;font-size:clamp(2rem,5vw,3.5rem);margin:10px 0;color:#a64f7b}.sub{max-width:680px;margin:0 auto 22px;line-height:1.8}.cake-area{position:relative;margin:10px auto 20px;width:min(360px,88vw);height:310px;display:flex;align-items:flex-end;justify-content:center}.cake{position:relative;width:250px;height:145px;background:linear-gradient(90deg,#e9a0bc,#ffd4df 45%,#e78bb0);border-radius:18px 18px 26px 26px;box-shadow:inset -12px 0 #d87ba5,0 18px 28px #a85c8133}.cake:before{content:'';position:absolute;top:-24px;left:-5px;width:260px;height:52px;border-radius:50%;background:#fff0f5;border-bottom:8px solid #ffb7d0;box-shadow:inset 0 -7px #f4a2c0}.drips{position:absolute;top:5px;left:20px;width:28px;height:35px;background:#fff0f5;border-radius:0 0 15px 15px;box-shadow:48px 5px #fff0f5,103px -2px #fff0f5,155px 7px #fff0f5,190px 0 #fff0f5}.cake-bottom{position:absolute;bottom:-12px;left:-12px;width:274px;height:28px;border-radius:50%;background:#ffbfd2;box-shadow:0 8px 0 #df8bac}.candle-row{position:absolute;top:-92px;left:0;width:100%;display:flex;justify-content:center;gap:15px;z-index:3}.candle{width:27px;height:65px;border-radius:7px 7px 3px 3px;background:repeating-linear-gradient(135deg,#fff 0 8px,#ff79a8 8px 16px);position:relative;display:flex;justify-content:center;align-items:center;color:#a64f7b;font-weight:900;font-size:1rem;padding-top:25px;box-shadow:0 2px 5px #9e456333}.flame{position:absolute;top:-25px;width:16px;height:24px;background:radial-gradient(ellipse at 50% 70%,#fff8ad 0 20%,#ffb23f 45%,#ff6c55 70%);border-radius:60% 40% 55% 45%;transform:rotate(5deg);filter:drop-shadow(0 0 8px #ffb53d);animation:flicker .6s infinite alternate}.cake-sprinkles{position:absolute;z-index:2;bottom:28px;left:28px;font-size:1.2rem;letter-spacing:13px}.cake-note{font-family:Georgia,serif;font-style:italic;font-size:1.15rem;margin:18px 0 28px}.wish-panel{background:#ffffffb8;backdrop-filter:blur(8px);border:1px solid #fff;border-radius:28px;padding:26px 18px;box-shadow:0 16px 50px #b76c8e1c;margin:20px auto 34px}.wish-panel h3{font-family:Georgia,serif;font-size:1.8rem;margin:0 0 8px;color:#a64f7b}.wish-panel>p{margin:0 0 22px;line-height:1.6}.wishes{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.wish-card{background:#fff9fc;border:1px solid #f8d9e5;border-radius:20px;padding:17px 12px;transition:.2s;text-align:center;color:var(--ink)}.wish-card:hover,.wish-card.active{transform:translateY(-4px);border-color:#ff80ad;box-shadow:0 10px 20px #d786a526;background:#fff}.wish-icon{font-size:2.3rem;display:block;margin-bottom:8px}.wish-card strong{display:block;font-size:1rem}.wish-card small{display:block;color:#a27d99;margin-top:5px;line-height:1.45}.wish-detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:center;text-align:left;margin-top:24px;padding:18px;background:#fff;border-radius:22px;animation:appear .45s ease}.photo-box{min-height:220px;border-radius:17px;background:linear-gradient(135deg,#ffe0ea,#f2e2ff);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.photo-box img{width:100%;height:100%;min-height:220px;object-fit:cover;position:absolute;inset:0}.photo-placeholder{text-align:center;padding:20px;font-size:3rem}.photo-placeholder span{display:block;font-size:.85rem;line-height:1.5;margin-top:10px;color:#916b8d}.wish-copy h4{font-family:Georgia,serif;font-size:1.7rem;margin:0 0 10px;color:#a64f7b}.wish-copy p{line-height:1.8;margin:0 0 12px}.photo-tools{display:flex;gap:8px;flex-wrap:wrap}.upload{display:inline-block;background:#fff0f5;color:#a64f7b;border-radius:999px;padding:9px 13px;font-size:.85rem;font-weight:700;cursor:pointer}.upload input{display:none}.wish-footer{margin-top:20px}.last-message{font-family:Georgia,serif;font-size:clamp(1.2rem,3vw,1.65rem);line-height:1.7;max-width:800px;margin:34px auto 15px;color:#a64f7b}.signature{font-weight:800;margin-bottom:30px}.sparkle{position:fixed;pointer-events:none;z-index:0;animation:floatUp linear infinite;opacity:.75}.heart{position:fixed;bottom:-40px;z-index:0;pointer-events:none;animation:floatHeart linear forwards;opacity:.7}.firework{position:fixed;width:5px;height:5px;border-radius:50%;pointer-events:none;z-index:5;box-shadow:0 0 8px currentColor;animation:burst 1.1s ease-out forwards}@keyframes bob{50%{transform:translateY(-12px) rotate(3deg)}}@keyframes flicker{to{transform:rotate(-8deg) scale(.9);filter:drop-shadow(0 0 14px #ffcb57)}}@keyframes floatUp{from{transform:translateY(105vh) rotate(0)}to{transform:translateY(-10vh) rotate(300deg)}}@keyframes floatHeart{to{transform:translateY(-115vh) translateX(var(--drift)) rotate(25deg);opacity:0}}@keyframes burst{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}footer{font-size:.8rem;color:#b58ca7;padding:0 10px 25px}@media(max-width:700px){.wishes{grid-template-columns:repeat(2,1fr)}.wish-detail{grid-template-columns:1fr}.photo-box,.photo-box img{min-height:200px}.cake-area{transform:scale(.92);margin-top:0;margin-bottom:0}.wish-panel{padding:22px 13px}.screen{padding:22px 15px}}
</style>
</head>
<body>
<!-- =========================================================
     KHU VỰC NỘI DUNG DỄ CHỈNH SỬA
     Bạn chỉ cần sửa chữ nằm trong phần CONFIG ở đầu script bên dưới.
     Ảnh: tạo thư mục "images" cạnh file HTML rồi ghi đường dẫn, ví dụ:
     image: "images/gia-dinh.jpg"
     Nếu chưa có ảnh, để image: "".
     ========================================================= -->
<section class="screen" id="intro"><div class="intro"><div class="eyebrow" id="introEyebrow"></div><div class="gift">🎁</div><h1 id="introTitle"></h1><p id="introText"></p><button class="main-btn" id="openBtn">Mở quà nè, Út ơi ✨</button><div class="tiny" id="introTiny"></div></div></section>
<section class="screen celebration hidden" id="celebration"><div class="wrap"><div class="section-tag" id="birthdayDate"></div><h2 id="birthdayTitle"></h2><p class="sub" id="birthdayIntro"></p><div class="cake-area"><div class="cake"><div class="drips"></div><div class="cake-bottom"></div><div class="cake-sprinkles">✦ · ✧ · ✦</div><div class="candle-row"><div class="candle" id="candle1"><span class="flame"></span>4</div><div class="candle" id="candle2"><span class="flame"></span>5</div></div></div></div><div class="cake-note" id="cakeNote"></div><button class="main-btn" id="blowBtn">Út thổi nến đi nè! 🎂</button>
<div class="wish-panel"><h3 id="wishSectionTitle"></h3><p id="wishSectionIntro"></p><div class="wishes" id="wishCards"></div>
<div class="wish-detail"><div class="photo-box" id="photoBox"><div class="photo-placeholder" id="photoPlaceholder">📸<span>Thêm ảnh kỷ niệm ở khu vực nội dung bên dưới code nha</span></div><img id="wishPhoto" class="hidden" alt="Ảnh kỷ niệm"></div><div class="wish-copy"><h4 id="wishTitle"></h4><p id="wishText"></p><div class="photo-tools"><label class="upload">＋ Chọn ảnh từ máy<input type="file" id="photoUpload" accept="image/*"></label><button class="upload" id="resetPhoto">Bỏ ảnh đang chọn</button></div></div></div>
<div class="wish-footer"><button class="main-btn" id="moreHearts">Gửi Út ngàn trái tim 💕</button></div></div>
<p class="last-message" id="lastMessage"></p><div class="signature" id="signature"></div><footer id="footerText"></footer></div></section>
<script>
/* =========================================================
   CONFIG — CHỈNH LỜI CHÚC, TIÊU ĐỀ VÀ ẢNH Ở ĐÂY
   1) Thay nội dung trong dấu nháy '...'
   2) Ảnh: tạo thư mục images cùng chỗ với file HTML.
      Ví dụ: image: 'images/ut.jpg' hoặc image: 'images/gia-dinh.jpg'
      Tên file phải khớp chính xác. Chưa có ảnh thì để image: ''.
   3) Lưu file (Ctrl+S), sau đó tải lại trang web (Ctrl+R).
   ========================================================= */
const CONFIG = {
  introEyebrow: 'Một món quà nhỏ, thật nhiều yêu thương',
  introTitle: 'ÚT ƠI CON CÓ\nMÓN QUÀ TẶNG CHO ÚT',
  introText: 'Hôm nay là ngày thật đặc biệt của Út. Con có một món quà nhỏ muốn gửi đến Út — mình cùng mở nha! 💗',
  introTiny: 'Dành riêng cho Út trong ngày sinh nhật tuổi 46',
  birthdayDate: 'Happy Birthday · 19 tháng 10',
  birthdayTitle: 'Chúc mừng sinh nhật Út! 💖',
  birthdayIntro: 'Chúc Út tuổi mới luôn vui vẻ, bình an và được yêu thương thật nhiều. Bây giờ Út nhắm mắt, ước một điều ước rồi cùng thổi nến nha!',
  ageBefore: '45',
  ageAfter: '46',
  cakeNoteBefore: 'Một điều ước thật đẹp dành cho Út… 🌷',
  cakeNoteAfter: 'Chúc mừng Út tuổi 46 — điều ước nào cũng thành hiện thực! ✨',
  wishSectionTitle: 'Út ước đi… 🌠',
  wishSectionIntro: 'Chọn từng điều ước để nhận món quà và lời chúc từ con nha.',
  lastMessage: '“Tuổi 46, con mong Út không chỉ có thêm tuổi mới, mà còn có thêm thật nhiều niềm vui, bình yên và những ngày tháng dịu dàng. Cảm ơn Út vì luôn là một phần thật quý giá của gia đình mình.”',
  signature: 'Con thương Út nhiều lắm! 💐',
  footerText: 'Món quà nhỏ được làm bằng tất cả tình yêu dành cho Út.',
  // Mỗi điều ước có: id, icon, title trên thẻ, dòng ngắn, tiêu đề chi tiết, lời chúc, đường dẫn ảnh.
  // Thay image bằng đường dẫn ảnh của bạn, ví dụ 'images/gia-dinh.jpg'.
  wishes: [
    { id:'family', icon:'🏡', cardTitle:'Gia đình', short:'Luôn sum vầy, bình an', title:'Điều ước về gia đình 🏡', text:'Con mong gia đình mình luôn bình an, thương yêu nhau và có thật nhiều dịp quây quần bên nhau. Mong nhà mình lúc nào cũng đầy ắp tiếng cười, vì chỉ cần mọi người khỏe mạnh và ở cạnh nhau là điều quý giá nhất rồi. ❤️', image:'', placeholder:'Thêm ảnh gia đình mình vào thư mục images nha Út' },
    { id:'love', icon:'💗', cardTitle:'Tình yêu', short:'Luôn được yêu thương', title:'Điều ước về tình yêu 💗', text:'Con mong Út luôn được yêu thương, trân trọng và quan tâm bằng những điều chân thành nhất. Mong những ngày phía trước của Út thật dịu dàng, có người để sẻ chia, có vòng tay để tựa vào và có thật nhiều lý do để mỉm cười. 💞', image:'', placeholder:'Thêm ảnh yêu thương của Út tại đây nha' },
    { id:'health', icon:'🌿', cardTitle:'Sức khỏe', short:'Khỏe mạnh, an vui', title:'Điều ước về sức khỏe 🌿', text:'Tuổi mới, con chỉ mong Út luôn khỏe mạnh, ngủ ngon, ăn ngon và mỗi ngày thức dậy đều thấy lòng nhẹ nhàng. Mong mọi mệt mỏi dần qua đi, bình an ở lại thật lâu, để Út có thể vui vẻ tận hưởng những điều mình yêu thích. 🌷', image:'', placeholder:'Thêm ảnh Út cười thật tươi ở đây nha' },
    { id:'children', icon:'👨‍👩‍👧‍👦', cardTitle:'Con cái', short:'Thuận hòa, hạnh phúc', title:'Điều ước về con cái 👨‍👩‍👧‍👦', text:'Con mong các con luôn ngoan ngoãn, khỏe mạnh, biết yêu thương và quan tâm đến Út. Mong Út luôn tự hào về các con, và tình cảm gia đình mình ngày càng gắn bó. Dù sau này mỗi người có bận rộn đến đâu, mong cả nhà vẫn luôn hướng về nhau. 🫶', image:'', placeholder:'Thêm ảnh Út và các con tại đây nha' }
  ]
};

const $ = id => document.getElementById(id);
const intro=$('intro'), celebration=$('celebration');
let blown=false, currentWish=CONFIG.wishes[0]?.id, uploadedPhotos={};
function fillText(id, value){ $(id).textContent=value ?? ''; }
fillText('introEyebrow',CONFIG.introEyebrow); fillText('introTitle',CONFIG.introTitle); $('introTitle').style.whiteSpace='pre-line';
fillText('introText',CONFIG.introText); fillText('introTiny',CONFIG.introTiny); fillText('birthdayDate',CONFIG.birthdayDate); fillText('birthdayTitle',CONFIG.birthdayTitle); fillText('birthdayIntro',CONFIG.birthdayIntro);
fillText('candle1',CONFIG.ageBefore[0] || '4'); fillText('candle2',CONFIG.ageBefore[1] || '5');
// Restore the flame elements after setting candle numbers.
$('candle1').innerHTML='<span class="flame"></span>'+((CONFIG.ageBefore+'')[0]||'4'); $('candle2').innerHTML='<span class="flame"></span>'+((CONFIG.ageBefore+'')[1]||'5');
fillText('cakeNote',CONFIG.cakeNoteBefore); fillText('wishSectionTitle',CONFIG.wishSectionTitle); fillText('wishSectionIntro',CONFIG.wishSectionIntro); fillText('lastMessage',CONFIG.lastMessage); fillText('signature',CONFIG.signature); fillText('footerText',CONFIG.footerText);
const cards=$('wishCards');
CONFIG.wishes.forEach((w,i)=>{const b=document.createElement('button');b.className='wish-card'+(i===0?' active':'');b.dataset.wish=w.id;b.innerHTML='<span class="wish-icon"></span><strong></strong><small></small>';b.querySelector('.wish-icon').textContent=w.icon;b.querySelector('strong').textContent=w.cardTitle;b.querySelector('small').textContent=w.short;b.addEventListener('click',()=>selectWish(w.id));cards.appendChild(b)});
function selectWish(id){currentWish=id;const w=CONFIG.wishes.find(x=>x.id===id);if(!w)return;document.querySelectorAll('.wish-card').forEach(b=>b.classList.toggle('active',b.dataset.wish===id));fillText('wishTitle',w.title);fillText('wishText',w.text);showPhoto(id,w);hearts(4)}
function showPhoto(id,w){const img=$('wishPhoto'),placeholder=$('photoPlaceholder');const src=uploadedPhotos[id] || w.image; if(src){img.src=src;img.classList.remove('hidden');placeholder.classList.add('hidden');}else{img.removeAttribute('src');img.classList.add('hidden');placeholder.classList.remove('hidden');placeholder.innerHTML='📸<span></span>';placeholder.querySelector('span').textContent=w.placeholder || 'Thêm ảnh kỷ niệm ở khu vực CONFIG đầu file nha';}}
selectWish(currentWish);
$('openBtn').addEventListener('click',()=>{intro.classList.add('hidden');celebration.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});startDecorations();fireworks(5)});
$('blowBtn').addEventListener('click',()=>{if(!blown){blown=true;$('candle1').innerHTML='<span class="flame"></span>'+((CONFIG.ageAfter+'')[0]||'4');$('candle2').innerHTML='<span class="flame"></span>'+((CONFIG.ageAfter+'')[1]||'6');fillText('cakeNote',CONFIG.cakeNoteAfter);$('blowBtn').textContent='Tuổi mới rực rỡ nha Út! 🎉';fireworks(9);hearts(18)}else{fireworks(4);hearts(8)}});
$('photoUpload').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=ev=>{uploadedPhotos[currentWish]=ev.target.result;showPhoto(currentWish,CONFIG.wishes.find(w=>w.id===currentWish))};reader.readAsDataURL(f)});
$('resetPhoto').addEventListener('click',()=>{delete uploadedPhotos[currentWish];$('photoUpload').value='';showPhoto(currentWish,CONFIG.wishes.find(w=>w.id===currentWish))});
$('moreHearts').addEventListener('click',()=>{hearts(35);fireworks(5)});
function startDecorations(){if(document.body.dataset.decorated)return;document.body.dataset.decorated='yes';for(let i=0;i<20;i++){const s=document.createElement('div');s.className='sparkle';s.textContent=['✦','✧','✨','♡'][Math.floor(Math.random()*4)];s.style.left=Math.random()*100+'vw';s.style.animationDuration=(8+Math.random()*12)+'s';s.style.animationDelay=(-Math.random()*15)+'s';s.style.fontSize=(12+Math.random()*20)+'px';s.style.color=['#ff8fb5','#c19be8','#f2bb6b'][i%3];document.body.appendChild(s)}}
function hearts(n){for(let i=0;i<n;i++){const h=document.createElement('div');h.className='heart';h.textContent=['💗','💕','💖','💝','❤️'][Math.floor(Math.random()*5)];h.style.left=Math.random()*100+'vw';h.style.fontSize=(17+Math.random()*23)+'px';h.style.setProperty('--drift',(Math.random()*160-80)+'px');h.style.animationDuration=(4+Math.random()*4)+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),8500)}}
function fireworks(n){for(let k=0;k<n;k++){setTimeout(()=>{const x=10+Math.random()*80,y=12+Math.random()*45;for(let i=0;i<28;i++){const p=document.createElement('i');p.className='firework';p.style.left=x+'vw';p.style.top=y+'vh';p.style.color=['#ff6f9f','#ffca68','#9d8bff','#7ce2cf'][Math.floor(Math.random()*4)];const a=(Math.PI*2*i)/28,r=45+Math.random()*85;p.style.setProperty('--x',Math.cos(a)*r+'px');p.style.setProperty('--y',Math.sin(a)*r+'px');document.body.appendChild(p);setTimeout(()=>p.remove(),1200)}},k*250)}}
</script></body></html>
